# CI — le vert cesse d'être une parole et devient une preuve.
#
# Avant ce fichier, le dépôt n'avait AUCUN lanceur de tests : `check_runs` valait 0 et le seul
# workflow listé était le graphe de dépendances Dependabot. Les 1747 tests ne tournaient que sur
# le poste de développement — « suite verte » était une affirmation invérifiable par un relecteur.
#
# ── Ce qui n'est PAS couvert ici, et pourquoi ────────────────────────────────────────────────
# Le frontend n'a pas de job. Ce n'est pas un oubli : `frontend/` n'a **pas de lockfile**
# (`npm ci` échouerait) et **aucun fichier de test** (`vitest run` ne trouverait rien). Un job
# qui installe des dépendances pour ne rien vérifier est un feu vert décoratif — précisément le
# « stub qui feint de fonctionner » que ce dépôt refuse. L'IHM reste donc non vérifiée, comme
# `HANDOFF.md` §2.1 le dit. La lever demande un lockfile et de vrais tests, pas un job de plus.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une PR qui reçoit trois pushes n'a pas besoin de trois runs : seul le dernier état compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — pytest · ruff · mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deux tests parlent à un vrai Redis (`test_account_view`, `test_macro_news`). Vérifié :
    # sans lui la suite rend 2 failed / 34 skipped. Les faire sauter en CI masquerait justement
    # le chemin d'état intra-session — on fournit donc le service plutôt que de le contourner.
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'        # figé : `target-version = "py311"` (pyproject)
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check app tests workers

      - name: mypy
        # Périmètre STRICT mais partiel (`files` dans pyproject) — étendu module par module.
        # L'activer partout d'un coup produirait un bruit qu'on apprendrait à ignorer.
        run: mypy

      - name: pytest
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q
