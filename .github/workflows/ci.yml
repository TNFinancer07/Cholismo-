# CI — le vert cesse d'être une parole et devient une preuve.
#
# Avant ce fichier, le dépôt n'avait AUCUN lanceur de tests : `check_runs` valait 0 et le seul
# workflow listé était le graphe de dépendances Dependabot. Les 1747 tests backend et les 125
# tests frontend ne tournaient que sur un poste de développement — « suite verte » était une
# affirmation invérifiable par un relecteur.
#
# Les deux jobs installent depuis un VERROU (`requirements.lock`, `package-lock.json`) et non
# depuis les bornes larges : un run ne doit pas pouvoir casser sur une release amont publiée
# entre deux commits. Un rouge doit toujours désigner le code, jamais le calendrier.
#
# ── Ce que la CI ne couvre PAS ───────────────────────────────────────────────────────────────
# `frontend/public/v17/` — la maquette vendue (`index.html` + `live.js`). Vérifié : elle n'est
# atteinte ni par `tsc` (hors de `include: ["src"]`) ni par aucun des 9 fichiers de test. C'est
# du HTML/JS statique, et seule une ouverture réelle dans un navigateur la valide
# (`docs/p4-verification.md`). Aucun job ici ne prétend le contraire.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une PR qui reçoit trois pushes n'a pas besoin de trois runs : seul le dernier état compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — ruff · mypy · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deux tests parlent à un vrai Redis (`test_account_view`, `test_macro_news`). Vérifié :
    # sans lui la suite rend 2 failed / 34 skipped. Les faire sauter en CI masquerait justement
    # le chemin d'état intra-session — on fournit donc le service plutôt que de le contourner.
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'        # figé : `target-version = "py311"` (pyproject)
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Dépendances (verrouillées)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: ruff
        run: ruff check app tests workers

      - name: mypy
        # Périmètre STRICT mais partiel (`files` dans pyproject) — étendu module par module.
        # L'activer partout d'un coup produirait un bruit qu'on apprendrait à ignorer.
        run: mypy

      - name: pytest
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  frontend:
    name: frontend — tsc · vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances (verrouillées)
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        # `strict: true`, et vérifié : les 81 fichiers de `src/` sont réellement traversés.
        # Un typecheck qui compile zéro fichier passe aussi — il fallait le compter.
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run
