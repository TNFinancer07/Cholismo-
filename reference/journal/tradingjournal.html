<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Journal de Session — Sony &amp; Youssef</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{background:#0B0D10;color:#E7E9EC;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;font-size:14px;line-height:1.45}
.mono{font-family:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace}
.dim{color:#8A909C}.txt-xs{font-size:11.5px}.pass{color:#3FB68B}.fail{color:#D9614F}.warn{color:#D9A23B}.pos{color:#3FB68B}.neg{color:#D9614F}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(#0F1216,#0B0D10);border-bottom:1px solid #262B33}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{font-size:22px;color:#3FB68B}
.brand-title{font-size:12px;font-weight:700;letter-spacing:.08em}
.brand-sub{font-size:11px;color:#8A909C;margin-top:2px}
.view-nav{display:flex;gap:4px;background:#1A1E24;border-radius:7px;padding:3px}
.view-nav button{background:none;border:none;color:#8A909C;font-size:12px;padding:5px 12px;border-radius:5px;cursor:pointer;font-family:inherit}
.view-nav button.active{background:#14171C;color:#E7E9EC}
.topbar-stats{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat-label{font-size:10px;color:#565C66;text-transform:uppercase;letter-spacing:.04em}
.stat-value{font-family:"SF Mono",ui-monospace,monospace;font-size:15px;font-weight:600}
.save-dot-row{display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%}
.dot-saved{background:#3FB68B}.dot-saving{background:#D9A23B;animation:p 1s infinite}.dot-error{background:#D9614F}
@keyframes p{50%{opacity:.3}}
.lockbar{background:#2A1612;color:#F0A18F;font-size:12px;padding:7px 20px;border-top:1px solid #4A2419}
.layout{display:grid;grid-template-columns:268px 1fr;gap:18px;max-width:1160px;margin:0 auto;padding:18px}
.hist-layout{max-width:900px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:16px}
@media(max-width:860px){.layout{grid-template-columns:1fr;padding:10px}}
.panel{background:#14171C;border:1px solid #262B33;border-radius:10px;padding:14px;margin-bottom:14px}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#8A909C;margin-bottom:10px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:3px}
.field.full{grid-column:1/-1}
.lbl{font-size:10.5px;font-weight:600;color:#8A909C}
.inp-wrap{position:relative;display:flex;align-items:center}
.inp-wrap input,.field select,.field textarea{background:#1A1E24;border:1px solid #262B33;border-radius:6px;padding:6px 8px;color:#E7E9EC;font-size:13px;font-family:inherit;outline:none;width:100%}
.inp-wrap input:focus,.field select:focus,.field textarea:focus{border-color:#3F4956}
.inp-wrap input:disabled,.field select:disabled,.field textarea:disabled{opacity:.5;cursor:not-allowed}
.suffix{position:absolute;right:8px;font-size:11px;color:#565C66;pointer-events:none}
.field textarea{resize:vertical}
.field input[type=time]{background:#1A1E24;border:1px solid #262B33;border-radius:6px;padding:6px 8px;color:#E7E9EC;font-size:13px;font-family:inherit;outline:none;width:100%}
.vix-pill{margin-top:8px;font-size:12px;padding:6px 9px;border-radius:6px}
.vix-pass{background:#16241D;color:#3FB68B}.vix-warn{background:#261F12;color:#D9A23B}.vix-fail{background:#271717;color:#D9614F}
.limits-box{margin-top:10px;padding:9px;background:#1A1E24;border-radius:7px}
.limits-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.lock-list{padding-left:14px;font-size:12px;color:#D9A23B;line-height:1.7;margin-bottom:8px}
.chk-row{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;margin-bottom:6px}
.export-row{display:flex;gap:7px}
.btn-exp{flex:1;background:#1A1E24;border:1px solid #262B33;color:#E7E9EC;border-radius:6px;padding:7px;font-size:12px;cursor:pointer}
.btn-exp:hover{border-color:#3A4048}
.ref-table{width:100%;border-collapse:collapse;font-size:11.5px}
.ref-table th{text-align:left;color:#565C66;font-weight:600;padding:4px 5px;border-bottom:1px solid #262B33}
.ref-table td{padding:5px 5px;border-bottom:1px solid #1C2026}
.ref-table.full-table{font-size:12px}
.sent-panel{margin-bottom:18px}
.sent-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:640px){.sent-grid{grid-template-columns:1fr}}
.sent-col{display:flex;flex-direction:column;gap:8px}
.sent-trader{font-size:13px;font-weight:700}
.mood-row{display:flex;align-items:center;gap:9px}
.mood-row input[type=range]{flex:1;accent-color:#3FB68B}
.mood-val{font-size:12px;color:#8A909C;min-width:28px}
.delta-row{display:flex;gap:5px;flex-wrap:wrap}
.delta{font-size:10.5px;padding:2px 7px;border-radius:4px;font-family:"SF Mono",monospace}
.delta.pos{background:#16241D;color:#3FB68B}.delta.neg{background:#271717;color:#D9614F}
.tabs{display:flex;gap:7px;margin-bottom:16px}
.tab{background:#14171C;border:1px solid #262B33;border-radius:8px;padding:8px 13px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.tab:hover{border-color:#3A4048}
.tab-trader{font-size:9.5px;color:#565C66;text-transform:uppercase;letter-spacing:.04em}
.tab-id{font-size:13px;font-weight:700;color:#8A909C}
.tab.active{box-shadow:inset 0 0 0 1px var(--acc)}
.tab.active .tab-id{color:#E7E9EC}
.strat-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-left:3px solid var(--acc);padding:4px 0 4px 13px;margin-bottom:16px}
.strat-title{font-size:17px;font-weight:700;margin-bottom:3px}
.strat-meta{font-size:12px;color:#8A909C}
.btn-add{background:var(--acc);color:#0B0D10;border:none;border-radius:7px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-add:hover{filter:brightness(1.08)}
.btn-add:disabled{opacity:.4;cursor:not-allowed}
.empty{color:#565C66;font-size:12.5px;padding:26px 14px;text-align:center;border:1px dashed #262B33;border-radius:10px}
.card{background:#14171C;border:1px solid #262B33;border-radius:10px;margin-bottom:10px}
.card.blocked{border-color:#432420}
.card.card-locked{border-color:#2A2F37}
.card-head{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:11px 13px;cursor:pointer;color:#E7E9EC;font-family:inherit}
.ch-left,.ch-right{display:flex;align-items:center;gap:8px}
.ci{font-size:11px}.lock-icon{font-size:11px}
.dir{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:4px;background:#1A1E24;color:#8A909C}
.dir.long{background:#16241D;color:#3FB68B}.dir.short{background:#271717;color:#D9614F}
.cp{font-size:13px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:#1A1E24;color:#8A909C}
.b-pass{background:#16241D;color:#3FB68B}.b-warn{background:#261F12;color:#D9A23B}.b-fail{background:#271717;color:#D9614F}
.r-win{background:#16241D;color:#3FB68B}.r-loss{background:#271717;color:#D9614F}.r-be{background:#1A1E24;color:#8A909C}
.chev{color:#565C66;font-size:16px;width:16px;text-align:center}
.card-body{padding:4px 15px 16px;border-top:1px solid #262B33}
.section{margin-top:14px}
.section-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#8A909C;margin-bottom:8px}
.blocker-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #1C2026;font-size:12px}
.toggle{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:5px;border:1px solid #262B33;background:#1A1E24;color:#565C66;cursor:pointer;min-width:62px}
.toggle:disabled{opacity:.5;cursor:not-allowed}
.t-pass{background:#16241D;color:#3FB68B;border-color:#1F3A2C}
.t-fail{background:#271717;color:#D9614F;border-color:#432420}
.pilier-row{display:grid;grid-template-columns:1fr 52px 32px;align-items:center;gap:9px;margin-bottom:7px}
.pilier-info{display:flex;flex-direction:column;gap:3px}
.bar-track{height:4px;background:#1A1E24;border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .2s}
.score-inp{background:#1A1E24;border:1px solid #262B33;border-radius:5px;padding:5px 7px;color:#E7E9EC;font-size:12.5px;text-align:right;width:100%;font-family:"SF Mono",monospace}
.score-inp:disabled{opacity:.5}
.derived-row{display:flex;align-items:center;gap:12px;margin-top:9px;padding:9px;background:#1A1E24;border-radius:7px;flex-wrap:wrap}
.ref-box{margin-top:9px;padding:10px 11px;background:#1A1E24;border-radius:7px;border:1px solid #262B33}
.ref-title{display:block;font-size:10px;font-weight:700;color:#8A909C;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.ref-row{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:#8A909C;padding:3px 0}
.ref-row strong{color:#E7E9EC}
.ref-row .mono{min-width:28px}
.banner{margin-top:8px;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.4}
.b-fail{background:#261513;color:#E58B7C;border:1px solid #432420}
.b-warn{background:#261F12;color:#E0B976;border:1px solid #433620}
.b-info{background:#121F26;color:#7CC0E5;border:1px solid #1F3A43}
.b-locked{background:#1A1E24;color:#8A909C;border:1px solid #262B33;display:flex;align-items:center;gap:8px;justify-content:space-between}
.link-btn{background:none;border:none;color:#3FB68B;text-decoration:underline;cursor:pointer;font-size:12px;font-family:inherit}
.card-actions{margin-top:14px;display:flex;justify-content:flex-end;gap:7px;align-items:center}
.btn-del{background:none;border:1px solid #262B33;color:#565C66;border-radius:6px;padding:6px 11px;font-size:11.5px;cursor:pointer}
.btn-del:hover{color:#D9614F;border-color:#432420}
.btn-close{background:#3FB68B;color:#0B0D10;border:none;border-radius:6px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer}
.btn-close:hover{filter:brightness(1.08)}
.agg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.agg-grid{grid-template-columns:1fr 1fr}}
.auto-row{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #1C2026}
.auto-row:last-child{border-bottom:none}
.auto-row .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.auto-row .meta strong{font-size:12.5px;color:#E7E9EC}
.auto-row .meta .d{font-size:11px;color:#8A909C;line-height:1.4}
.auto-row input[type=text]{background:#1A1E24;border:1px solid #262B33;border-radius:6px;padding:5px 8px;color:#E7E9EC;font-size:12px;font-family:"SF Mono",ui-monospace,monospace;width:100%;outline:none}
.auto-row input[type=text]:focus{border-color:#3F4956}
.auto-toggle{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#8A909C;cursor:pointer;user-select:none}
.auto-btn{background:#1A1E24;border:1px solid #262B33;color:#E7E9EC;font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap}
.auto-btn:hover{background:#1F242B}
.auto-btn.primary{background:#16241D;border-color:#1E3A2C;color:#3FB68B}
.auto-btn.primary:hover{background:#1B2D24}
.auto-btn.danger{background:#271717;border-color:#3A1E1E;color:#D9614F}
.auto-pre{background:#0E1115;border:1px solid #1C2026;border-radius:6px;padding:9px 10px;font-family:"SF Mono",ui-monospace,monospace;font-size:11px;color:#A9B2BD;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.auto-tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.auto-tag.ok{background:#16241D;color:#3FB68B}
.auto-tag.err{background:#271717;color:#D9614F}
.auto-tag.pend{background:#261F12;color:#D9A23B}
.auto-rep{padding:10px;background:#1A1E24;border-radius:7px;margin-bottom:9px;border:1px solid #262B33}
.auto-rep-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px}
.auto-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.auto-grid2{grid-template-columns:1fr}}
.footer{text-align:center;font-size:11px;color:#565C66;padding:22px 18px 32px}
</style>
</head>
